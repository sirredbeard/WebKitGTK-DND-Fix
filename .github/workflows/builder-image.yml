# Build and push the webkitgtk-dnd-fix-builder image to GHCR, for both
# arches. Each arch builds on a runner of that arch (no QEMU: the dnf
# package set is the WebKit build toolchain, and an emulated install of
# it would take all day). The per-arch images push as latest-<arch> and
# YYYY.MM.DD-<arch>; a manifest job then joins them into the plain
# latest and YYYY.MM.DD tags, so consumers (copilot-desktop-gtk's
# webkit-dnd rebuild, this repo's own VM runners) keep pulling one name
# and get their arch.
#
# Before this workflow the image was x86_64 only, built by hand, which
# is why the aarch64 WebKit overlay in copilot-desktop-gtk could not
# exist: its rebuild job runs this image on a self-hosted runner of the
# target arch.
#
# Image tags: latest + YYYY.MM.DD (UTC build date), each a multi-arch
# manifest over x86_64 and aarch64.
name: builder-image

on:
  push:
    branches: [main]
    paths:
      - "containers/**"
      - ".github/workflows/builder-image.yml"
  pull_request:
    paths:
      - "containers/**"
      - ".github/workflows/builder-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: webkitgtk-dnd-fix-builder
  REGISTRY: ghcr.io

jobs:
  # One date tag for the whole run, computed once so the two arch legs
  # and the manifest job agree even if a leg straddles midnight UTC.
  meta:
    runs-on: ubuntu-latest
    outputs:
      date_tag: ${{ steps.ver.outputs.date_tag }}
      image: ${{ steps.ver.outputs.image }}
    steps:
      - name: Image version (YYYY.MM.DD UTC)
        id: ver
        run: |
          set -euo pipefail
          DATE_TAG="$(date -u +%Y.%m.%d)"
          IMAGE="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}"
          {
            echo "date_tag=${DATE_TAG}"
            echo "image=${IMAGE}"
          } >> "$GITHUB_OUTPUT"
          echo "builder image: ${IMAGE} (${DATE_TAG})"

  build-and-push:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Per-arch image tags
        id: ver
        env:
          IMAGE: ${{ needs.meta.outputs.image }}
          DATE_TAG: ${{ needs.meta.outputs.date_tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          {
            echo "tag_latest=${IMAGE}:latest-${ARCH}"
            echo "tag_date=${IMAGE}:${DATE_TAG}-${ARCH}"
          } >> "$GITHUB_OUTPUT"
          echo "builder tags (this arch): latest-${ARCH} ${DATE_TAG}-${ARCH}"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: containers
          file: containers/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.ver.outputs.tag_latest }}
            ${{ steps.ver.outputs.tag_date }}
          labels: |
            org.opencontainers.image.title=webkitgtk-dnd-fix-builder
            org.opencontainers.image.description=Fedora 43 toolchain for WebKitGTK, SelectionData tests, GNOME Web AppImage + Flatpak
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.meta.outputs.date_tag }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=webkit-builder-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=webkit-builder-${{ matrix.arch }}

  # Join the two per-arch images under the plain tags. Runs only when
  # the arch legs pushed (never on a pull request).
  manifest:
    if: github.event_name != 'pull_request'
    needs: [meta, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifests
        env:
          IMAGE: ${{ needs.meta.outputs.image }}
          DATE_TAG: ${{ needs.meta.outputs.date_tag }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "${IMAGE}:latest" \
            "${IMAGE}:latest-x86_64" \
            "${IMAGE}:latest-aarch64"
          docker buildx imagetools create \
            -t "${IMAGE}:${DATE_TAG}" \
            "${IMAGE}:${DATE_TAG}-x86_64" \
            "${IMAGE}:${DATE_TAG}-aarch64"
          docker buildx imagetools inspect "${IMAGE}:latest"
